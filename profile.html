<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — RescueNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topbar"></div>
  <main class="container">
    <div class="profile-intro"><span class="eyebrow">YOUR RESCUENEST</span><h1>Your corner of the <em>community.</em></h1><p>Manage your details and revisit the animals you have helped.</p></div>
    <div class="card profile-card">
      <div class="profile-head">
        <div class="avatar large" id="profile-avatar">U</div>
        <div>
          <h2 id="profile-name">—</h2>
          <p id="profile-location" class="muted">Location not set</p>
        </div>
      </div>
<p id="profile-bio" class="muted bio">No bio yet.</p>
      <div class="row gap">
        <button class="btn btn-ghost btn-sm" onclick="toggleEdit()">✏️ Edit profile</button>
        <button class="btn btn-danger btn-sm" onclick="handleLogout()">Log out</button>
      </div>

      <!-- Edit form -->
      <form id="edit-form" class="hidden" style="margin-top:14px">
        <div class="field">
          <label>Name</label>
          <input type="text" id="edit-name">
        </div>
        <div class="field">
          <label>Location</label>
          <input type="text" id="edit-location" placeholder="City, State">
        </div>
        <div class="field">
          <label>Bio</label>
          <textarea id="edit-bio" rows="3" placeholder="Tell the community about yourself"></textarea>
        </div>
        <div class="row gap">
          <button type="submit" class="btn btn-primary btn-sm">Save</button>
          <button type="button" class="btn btn-ghost btn-sm" onclick="toggleEdit()">Cancel</button>
        </div>
      </form>
    </div>

    <div class="page-head" style="margin-top:22px">
      <h2>My posts</h2>
    </div>
    <div id="my-posts" class="feed"></div>
  </main>

  <script src="./config.js"></script>
  <script type="module">
    import { onAuth, getUserProfile, updateUserProfile, getUserPosts, logoutUser } from "./supabase-service.js";
    import { topBar, toast, escapeHtml } from "./js/app.js";
    import { postCard } from "./js/posts.js";

    let currentUid = null;
    let profile = null;

    onAuth(async (user) => {
      if (!user) return (window.location.href = "login.html");
      currentUid = user.id;
      profile = (await getUserProfile(user.id).catch(() => null)) || {};
      profile.name = profile.name || user.displayName || user.email;

      document.getElementById("topbar").innerHTML = topBar(profile, "profile");
      renderProfile();
      renderMyPosts();
    });

    function renderProfile() {
      const initial = (profile.name || "U").charAt(0).toUpperCase();
      document.getElementById("profile-avatar").textContent = initial;
      document.getElementById("profile-name").textContent = profile.name;
      document.getElementById("profile-location").textContent = profile.location || "Location not set";
      document.getElementById("profile-bio").textContent = profile.bio || "No bio yet.";
      document.getElementById("edit-name").value = profile.name || "";
      document.getElementById("edit-location").value = profile.location || "";
      document.getElementById("edit-bio").value = profile.bio || "";
    }

    async function renderMyPosts() {
      const posts = await getUserPosts(currentUid).catch(() => []);
      const area = document.getElementById("my-posts");
      if (!posts.length) {
        area.innerHTML = '<div class="card empty-state"><span class="big">🐾</span><h3>No posts yet</h3><button class="btn btn-primary" onclick="window.location.href=\'create-post.html\'">Create your first post</button></div>';
        return;
      }
      area.innerHTML = posts.map((p) => postCard(p, currentUid)).join("");
    }

window.toggleEdit = () => document.getElementById("edit-form").classList.toggle("hidden");

    window.handleLogout = async () => {
      try {
        await logoutUser();
        toast("Logged out. See you soon! 👋");
        setTimeout(() => (window.location.href = "login.html"), 900);
      } catch (err) {
        toast("Could not log out.", "error");
      }
    };

    document.getElementById("edit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("edit-name").value.trim();
      const location = document.getElementById("edit-location").value.trim();
      const bio = document.getElementById("edit-bio").value.trim();
      if (!name) return toast("Name cannot be empty.", "error");

      try {
        await updateUserProfile(currentUid, { name, location, bio });
        profile = { ...profile, name, location, bio };
        renderProfile();
        document.getElementById("topbar").innerHTML = topBar(profile, "profile");
        document.getElementById("edit-form").classList.add("hidden");
        toast("Profile updated! ✅");
      } catch (err) {
        toast("Could not update profile.", "error");
      }
    });

    // Post actions
    window.handleLike = async (btn) => {
      const { toggleLike } = await import("./supabase-service.js");
      if (!currentUid) return;
      const holder = btn.querySelector("b");
      const postId = btn.getAttribute("data-id");
      const liked = await toggleLike(postId, currentUid);
      btn.classList.toggle("liked", liked);
      const cur = parseInt(holder.textContent, 10) || 0;
      holder.textContent = liked ? cur + 1 : Math.max(0, cur - 1);
    };
    window.goToPost = (id) => (window.location.href = "post.html?id=" + id);
    window.sharePost = (id) => {
      const url = window.location.origin + window.location.pathname.replace(/[^/]*$/, "") + "post.html?id=" + id;
      if (navigator.share) navigator.share({ title: "RescueNest", url }).catch(() => {});
      else navigator.clipboard.writeText(url).then(() => toast("Link copied! 🔗"));
    };
    window.copyPhone = (phone) => {
      if (!phone) return toast("No phone number.", "error");
      navigator.clipboard.writeText(phone).then(() => toast("Phone copied! 📋"));
    };
    window.deleteMyPost = () => {};
  </script>
</body>
</html>
