<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post — RescueNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topbar"></div>
  <main class="container">
    <div class="page-head detail-back">
      <button class="btn btn-ghost btn-sm" onclick="history.back()">← Back</button>
    </div>
    <div id="post-area">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
    <div id="comments-area">
      <div class="card" style="padding:18px;margin-top:16px">
        <h4 style="margin:0 0 12px">Comments</h4>
        <div id="comments-list"></div>
        <form id="comment-form" class="comment-form">
          <input type="text" id="comment-input" placeholder="Write a comment..." required>
          <button type="submit">Post</button>
        </form>
      </div>
    </div>
  </main>

  <script src="./config.js"></script>
  <script type="module">
    import { onAuth, getPost, getUserProfile, onComments, addComment, toggleLike, deletePost } from "./supabase-service.js";
    import { topBar, toast, escapeHtml } from "./js/app.js";
    import { postDetail } from "./js/posts.js";

    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");
    let currentUid = null;
    let currentPost = null;
    let stopComments = null;

    onAuth(async (user) => {
      if (!user) {
        document.getElementById("topbar").innerHTML = topBar(null, "home");
        document.getElementById("comment-input").disabled = true;
        document.getElementById("comment-input").placeholder = "Sign in to write a comment";
        document.querySelector("#comment-form button").disabled = true;
      } else {
        currentUid = user.uid;
        const profile = await getUserProfile(user.uid).catch(() => null);
        document.getElementById("topbar").innerHTML = topBar({ name: profile?.name || user.displayName || user.email }, "home");
      }

      if (!postId) {
        document.getElementById("post-area").innerHTML = '<div class="card empty-state"><span class="big">🐾</span><h3>Post not found</h3></div>';
        return;
      }

      // Load post
      currentPost = await getPost(postId).catch(() => null);
      if (!currentPost) {
        document.getElementById("post-area").innerHTML = '<div class="card empty-state"><span class="big">😕</span><h3>Post not found or was deleted.</h3></div>';
        return;
      }
      document.getElementById("post-area").innerHTML = postDetail(currentPost, currentUid);

      // Realtime comments
      if (stopComments) stopComments();
      stopComments = onComments(postId, (comments) => {
        const list = document.getElementById("comments-list");
        if (!comments.length) {
          list.innerHTML = '<p style="color:var(--muted);font-size:14px">No comments yet. Be the first! 💬</p>';
          return;
        }
        list.innerHTML = comments.map((c) => {
          const initial = (c.authorName || "U").charAt(0).toUpperCase();
          return (
            '<div class="comment">' +
            '<div class="avatar">' + escapeHtml(initial) + "</div>" +
            '<div class="comment-bubble"><b>' + escapeHtml(c.authorName || "Unknown") + "</b>" + escapeHtml(c.text) + "</div>" +
            "</div>"
          );
        }).join("");
      });
    });

    // Comment submit
    document.getElementById("comment-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("comment-input");
      const text = input.value.trim();
      if (!text) return;
      try {
        await addComment(postId, text);
        input.value = "";
      } catch (err) {
        toast(err.message || "Could not post comment.", "error");
      }
    });

    // Like handler
    window.handleLike = async (btn) => {
      if (!currentUid || !currentPost) return;
      const holder = btn.querySelector("b");
      try {
        const liked = await toggleLike(currentPost.id, currentUid);
        btn.classList.toggle("liked", liked);
        const cur = parseInt(holder.textContent, 10) || 0;
        holder.textContent = liked ? cur + 1 : Math.max(0, cur - 1);
      } catch (e) {
        toast("Please log in to like.", "error");
      }
    };

    window.sharePost = () => {
      const url = window.location.href;
      if (navigator.share) navigator.share({ title: "RescueNest", url }).catch(() => {});
      else navigator.clipboard.writeText(url).then(() => toast("Link copied! 🔗"));
    };

    window.copyPhone = (phone) => {
      if (!phone) return toast("No phone number.", "error");
      navigator.clipboard.writeText(phone).then(() => toast("Phone number copied! 📋"));
    };

    window.focusComment = () => document.getElementById("comment-input")?.focus();

    window.deleteMyPost = async (id) => {
      if (!currentUid || !currentPost || currentPost.authorId !== currentUid) return;
      if (!confirm("Delete this post permanently?")) return;
      try {
        await deletePost(id);
        toast("Post deleted.");
        window.location.href = "feed.html";
      } catch (err) {
        toast("Could not delete post.", "error");
      }
    };
  </script>
</body>
</html>
