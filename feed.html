<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — RescueNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topbar"></div>
  <main class="container">
    <section class="feed-welcome">
      <div>
        <span class="eyebrow">THE COMMUNITY NOTICEBOARD</span>
        <h1>Make a small <em>difference</em> today.</h1>
        <p>Explore animals looking for a home and local rescue requests that need caring hands.</p>
      </div>
      <button class="btn btn-primary" onclick="window.location.href='create-post.html'">✦ Share a post</button>
    </section>
    <div class="feed-toolbar">
      <span>Latest community stories</span>
      <a href="search.html">Browse by location →</a>
    </div>
    <div id="feed" class="feed">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
  </main>
  <a href="create-post.html" class="fab">+</a>

  <script src="./config.js"></script>
  <script type="module">
    import { onAuth, onPosts, getUserProfile, toggleLike } from "./supabase-service.js";
    import { topBar, toast, escapeHtml } from "./js/app.js";
    import { postCard } from "./js/posts.js";

    let currentUser = null;
    let currentUid = null;

    // Render top bar with auth state
    onAuth(async (user) => {
      if (!user) {
        document.getElementById("topbar").innerHTML = topBar(null, "home");
        return;
      }
      currentUid = user.id;
      const profile = await getUserProfile(user.id).catch(() => null);
      const name = profile?.name || user.displayName || user.email;
      currentUser = { name };
      document.getElementById("topbar").innerHTML = topBar(currentUser, "home");
    });

    // Realtime posts feed
    onPosts((posts) => {
      const feed = document.getElementById("feed");
      if (!posts.length) {
        feed.innerHTML =
          '<div class="card empty-state"><span class="big">🐾</span><h3>No posts yet</h3><p>Be the first to post an animal that needs help or a loving home.</p><button class="btn btn-primary" onclick="window.location.href=\'create-post.html\'">Create a post</button></div>';
        return;
      }
      feed.innerHTML = posts.map((p) => postCard(p, currentUid)).join("");
    });

    // Global helpers used by inline handlers
    window.handleLike = async (btn) => {
      if (!currentUid) return;
      const holder = btn.querySelector("b");
      const postId = btn.getAttribute("data-id");
      try {
        const liked = await toggleLike(postId, currentUid);
        btn.classList.toggle("liked", liked);
        const current = parseInt(holder.textContent, 10) || 0;
        holder.textContent = liked ? current + 1 : Math.max(0, current - 1);
      } catch (e) {
        toast("Please log in to like posts.", "error");
      }
    };

    window.goToPost = (id) => (window.location.href = "post.html?id=" + id);

    window.sharePost = (id) => {
      const url = window.location.origin + window.location.pathname.replace(/[^/]*$/, "") + "post.html?id=" + id;
      if (navigator.share) {
        navigator.share({ title: "RescueNest", url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => toast("Link copied! 🔗"));
      }
    };

    window.copyPhone = (phone) => {
      if (!phone) return toast("No phone number.", "error");
      navigator.clipboard.writeText(phone).then(() => toast("Phone number copied! 📋"));
    };

    window.deleteMyPost = () => {}; // handled by post owner via post.html
  </script>
</body>
</html>
