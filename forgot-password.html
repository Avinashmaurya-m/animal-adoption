<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — RescueNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
<div class="form-card card auth-brand">
      <a class="brand" href="index.html" style="justify-content:center;display:flex;align-items:center;gap:9px;font-size:22px;margin-bottom:16px;"><span class="logo" style="width:40px;height:40px;font-size:22px;">🐾</span>RescueNest</a>
      <h1>Reset password</h1>
      <p class="subtitle">Enter your email and we'll send you a reset link.</p>

      <form id="reset-form">
        <div class="field">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send reset link</button>
      </form>

      <p class="auth-alt"><a href="login.html">Back to log in</a></p>
    </div>
  </main>

  <script src="./config.js"></script>
  <script type="module">
    import { resetPassword } from "./supabase-service.js";
    import { toast } from "./js/app.js";

    const form = document.getElementById("reset-form");
    const btn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) {
        toast("Please enter your email.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Sending...";

      try {
        await resetPassword(email);
        toast("Reset link sent! Check your inbox. 📧");
        setTimeout(() => (window.location.href = "login.html"), 1800);
      } catch (err) {
        let msg = "Could not send reset link.";
        if (err.code === "auth/user-not-found") msg = "No account found with this email.";
        else if (err.code === "auth/invalid-email") msg = "Please enter a valid email.";
        toast(msg, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
