<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — RescueNest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="form-card card auth-brand">
      <a class="brand" href="index.html" style="justify-content:center;display:flex;align-items:center;gap:9px;font-size:22px;margin-bottom:16px;"><span class="logo" style="width:40px;height:40px;font-size:22px;">🐾</span>RescueNest</a>
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to keep making a difference for animals.</p>

      <form id="login-form">
        <div class="field">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      </form>

      <p class="auth-alt"><a href="forgot-password.html">Forgot password?</a></p>
      <p class="auth-alt">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <script src="./config.js"></script>
  <script type="module">
    import { loginUser } from "./supabase-service.js";
    import { toast } from "./js/app.js";

    const form = document.getElementById("login-form");
    const btn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        toast("Please fill in all fields.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        await loginUser(email, password);
        toast("Welcome back! 🐾");
        window.location.replace("feed.html");
      } catch (err) {
        let msg = "Login failed. Please try again.";
        if (err.code === "auth/user-not-found") msg = "No account found with this email.";
        else if (err.code === "auth/wrong-password" || err.code === "auth/invalid-credential") msg = "Incorrect password.";
        else if (err.code === "auth/invalid-email") msg = "Please enter a valid email.";
        else if (err.code === "auth/too-many-requests") msg = "Too many attempts. Try again later.";
        toast(msg, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
