<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetCircle</title><link rel="stylesheet" href="premium.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#111827;font:14px Poppins,Arial,sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.top{display:flex;align-items:center;padding:0 max(20px,calc((100% - 1160px)/2));gap:20px}.search{flex:1;max-width:350px;padding:11px;border:1px solid #e5e7eb;border-radius:9px}.nav{display:flex;align-items:center;gap:12px;margin-left:auto}.nav button{background:none;font-weight:600;color:#52605d}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px}.grid{max-width:1160px;margin:auto;padding:0 20px;display:grid;grid-template-columns:220px 1fr;gap:25px}.filter{padding:18px}.filter label{display:block;font-size:12px;font-weight:700;color:#62706b;margin-top:14px}.filter input,.filter select,.dialog input,.dialog textarea{width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:8px;margin-top:5px}.feedhead{display:flex;justify-content:space-between;align-items:center;margin:5px 0 12px}.feedhead h2,.dialog h2{font-family:'Playfair Display',serif}.post{overflow:hidden;margin-bottom:16px}.posthead{padding:15px;display:flex;gap:9px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#dff3ec}.who b,.who small{display:block}.who small{font-size:11px;color:#687570}.tag{margin-left:auto;font-size:10px;background:#e8f6f0;color:#0f766e;border-radius:16px;padding:6px}.tag.help{background:#fff0e7;color:#c65a11}.text{padding:0 15px 14px;line-height:1.55}.post img{width:100%;height:300px;object-fit:cover}.foot{padding:12px 15px;display:flex;gap:16px;color:#63726c;font-size:12px}.foot button{background:none;color:#0f766e;font-weight:700}.dialogbg{position:fixed;inset:0;z-index:5;background:#102a2480;display:grid;place-items:center;padding:16px}.dialog{max-width:520px;width:100%;max-height:90vh;overflow:auto;background:#fff;padding:25px;border-radius:18px}.dialog p{color:#63726c;line-height:1.5}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.cancel{padding:10px 14px;border-radius:8px;background:#edf2ef}.full{padding:10px 15px;border-radius:8px;background:#f97316;color:#fff;font-weight:700}.empty{padding:35px;text-align:center;color:#63726c}.footer a{display:block}@media(max-width:700px){.search,.nav button:not(.main){display:none}.grid{display:block}.filter{margin-bottom:18px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.post img{height:240px}}
</style></head><body><div id="app"></div><script src="./config.js"></script><script type="module">
import {auth,signUp,signIn,logOut,watchAuth,publishPost,watchPosts,getUserProfile,sendMessage,watchMessages} from "./supabase-service.js";
const root=document.getElementById("app");let user=null,profile=null,posts=[],selectedFile=null,stopPosts=null;
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function pop(html){const x=document.createElement("div");x.id="modal";x.className="dialogbg";x.innerHTML='<section class="dialog">'+html+"</section>";document.body.append(x)}window.closeModal=()=>document.getElementById("modal")?.remove();
function header(){return '<header class="top"><b class="brand"><img src="assets/petcircle-logo.png" alt="PetCircle logo">PetCircle</b><input class="search" oninput="filterPosts()" placeholder="Search pets or locations"><nav class="nav"><button onclick="home()">Home</button><button onclick="document.getElementById(\'community\').scrollIntoView({behavior:\'smooth\'})">Explore</button><button onclick="showMessages()">✉ Messages</button>'+(user?'<button>'+esc(profile?.name||user.email)+'</button><button class="main" onclick="logout()">Log out</button>':'<button onclick="showAuth(\'signup\')">Sign up</button><button class="main" onclick="showAuth(\'login\')">Log in</button>')+'</nav></header>'}
window.home=()=>{root.innerHTML=header()+'<section class="premium-hero"><div><div class="kicker">COMPASSION · CONNECTION · A BETTER TOMORROW</div><h1>Every pet deserves a safe, loving home.</h1><p>PetCircle connects caring people and verified animal organisations, so adoption and rescue can happen faster.</p><div class="hero-buttons"><button class="adopt" onclick="postForm(\'adoption\')">Adopt a Pet</button><button class="report" onclick="postForm(\'help\')">Report an Injured Animal</button></div></div><div class="hero-picture"><img src="https://images.unsplash.com/photo-1450778869180-41d0601e046e?auto=format&fit=crop&w=1100&q=85" alt="Happy pets"><div class="float-card"><b>🐾 A community that cares</b>Find help, home, and hope nearby.</div></div></section><section class="statbar"><div class="stats"><div class="stat"><b>1,248+</b><span>Animals Adopted</span></div><div class="stat"><b>86</b><span>Verified NGOs</span></div><div class="stat"><b>34</b><span>Cities Covered</span></div><div class="stat"><b>620+</b><span>Active Volunteers</span></div></div></section><section class="section"><div class="section-head"><div class="kicker">MEET YOUR MATCH</div><h2>Featured pets looking for a family</h2><p>Every adoption begins with a small moment of connection.</p></div><div class="feature-grid"><article class="feature"><img src="https://images.unsplash.com/photo-1558788353-f76d92427f16?auto=format&fit=crop&w=800&q=85" alt="Puppy"><div class="feature-body"><b>Milo · 4 months</b><p>Playful, vaccinated, and ready for a gentle family.</p><button onclick="postForm(\'adoption\')">Meet Milo →</button></div></article><article class="feature"><img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=85" alt="Cat"><div class="feature-body"><b>Luna · 2 years</b><p>A calm indoor companion with a big heart.</p><button onclick="postForm(\'adoption\')">Meet Luna →</button></div></article><article class="feature"><img src="https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?auto=format&fit=crop&w=800&q=85" alt="Dog"><div class="feature-body"><b>Bruno · 1 year</b><p>Friendly, curious, and waiting for his new beginning.</p><button onclick="postForm(\'adoption\')">Meet Bruno →</button></div></article></div></section><section class="how"><div class="section"><div class="section-head"><div class="kicker">SIMPLE · SAFE · SUPPORTIVE</div><h2>How PetCircle works</h2></div><div class="how-grid"><div class="how-card"><i>🐾</i><b>Discover</b><p>Explore adoption and rescue posts from your local community.</p></div><div class="how-card"><i>💬</i><b>Connect</b><p>Message a poster privately to learn more.</p></div><div class="how-card"><i>❤</i><b>Change a life</b><p>Adopt, rescue, or report a case that needs help.</p></div></div></div></section><section class="community" id="community"><div class="grid"><aside class="card filter"><b>Find your perfect companion</b><label>Location<input id="loc" oninput="filterPosts()" placeholder="Search city"></label><label>Post type<select id="kind" onchange="filterPosts()"><option value="all">Adoption & help</option><option value="adoption">Adoption</option><option value="help">Injured animals</option></select></label><button class="full" onclick="filterPosts()">Show matches</button></aside><section><div class="feedhead"><h2>From the community</h2><small id="count"></small></div><div id="feed"></div></section></div></section><footer class="footer"><div class="footer-inner"><div><b class="brand"><img src="assets/petcircle-logo.png" alt="">PetCircle</b><p>Compassion. Connection. A better tomorrow for every animal.</p></div><div><b>Explore</b><a>Adopt a pet</a><a>Rescue cases</a><a>Partner NGOs</a></div><div><b>Support</b><a>Safety centre</a><a>Contact us</a><a>Help & FAQs</a></div><div><b>Stay connected</b><a>Instagram</a><a>Facebook</a><a>hello@petcircle.org</a></div></div><div class="copyright">© 2026 PetCircle. Made with care for every paw, whisker, and heart.</div></footer>';renderPosts()};
function renderPosts(list=posts){const feed=document.getElementById("feed");if(!feed)return;document.getElementById("count").textContent=list.length+" active posts";feed.innerHTML=list.map(p=>'<article class="card post"><div class="posthead"><i class="avatar">🐾</i><span class="who"><b>'+esc(p.author)+'</b><small>'+esc(p.location)+'</small></span><span class="tag '+(p.kind==="help"?"help":"")+'">'+(p.kind==="help"?"NEEDS HELP":"FOR ADOPTION")+'</span></div><div class="text"><strong>'+esc(p.pet)+' — </strong>'+esc(p.text)+'</div>'+(p.imageUrl?'<img src="'+esc(p.imageUrl)+'" alt="Animal photo">':'')+'<div class="foot"><button onclick="messagePoster(\''+p.id+'\',\''+p.ownerId+'\',\''+esc(p.author)+'\')">✉ Message poster</button><span>⌖ '+esc(p.location)+'</span></div></article>').join("")||'<div class="card empty">No nearby posts yet. Share an adoption or rescue case to get started. 🐾</div>'}
window.filterPosts=()=>{const q=(document.querySelector(".search")?.value||"").toLowerCase(),loc=(document.getElementById("loc")?.value||"").toLowerCase(),kind=document.getElementById("kind")?.value||"all";renderPosts(posts.filter(p=>(kind==="all"||p.kind===kind)&&(!loc||p.location.toLowerCase().includes(loc))&&(!q||(p.pet+" "+p.location).toLowerCase().includes(q))))};
window.showAuth=mode=>pop('<button style="float:right" onclick="closeModal()">×</button><h2>'+ (mode==="login"?"Welcome back":"Create account")+'</h2><p>Sign in to post and message safely.</p><form onsubmit="authSubmit(event,\''+mode+'\')">'+(mode==="signup"?'<label>Name<input required name="name"></label>':'')+'<label>Email<input required type="email" name="email"></label><label>Password<input required type="password" minlength="6" name="password"></label><div class="buttons"><button type="button" class="cancel" onclick="closeModal()">Cancel</button><button class="full">'+(mode==="login"?"Log in":"Create account")+'</button></div></form>');
window.authSubmit=async(e,m)=>{e.preventDefault();const d=new FormData(e.target);try{m==="login"?await signIn(d.get("email"),d.get("password")):await signUp({name:d.get("name"),email:d.get("email"),password:d.get("password")});closeModal()}catch(x){alert(x.message)}};
window.postForm=k=>{if(!user)return showAuth("login");pop('<button style="float:right" onclick="closeModal()">×</button><h2>'+ (k==="help"?"Report an injured animal":"Post a pet for adoption")+'</h2><p>Add a photo and location so help can find them.</p><form onsubmit="publish(event,\''+k+'\')"><div class="formgrid"><label>Pet / animal name<input required name="pet"></label><label>Location<input required name="location"></label><label class="wide">Details<textarea required name="text"></textarea></label><label class="wide">Photo<input type="file" accept="image/*" onchange="selectedFile=this.files[0]"></label></div><div class="buttons"><button type="button" class="cancel" onclick="closeModal()">Cancel</button><button class="full">Publish post</button></div></form>')};
window.publish=async(e,k)=>{e.preventDefault();const d=new FormData(e.target);try{await publishPost({kind:k,pet:d.get("pet"),location:d.get("location"),text:d.get("text"),imageFile:selectedFile});selectedFile=null;closeModal()}catch(x){alert(x.message)}};
window.logout=()=>logOut();window.showMessages=()=>pop('<button style="float:right" onclick="closeModal()">×</button><h2>Messages</h2><p>Choose “Message poster” on any community post to start a private chat.</p>');
window.messagePoster=(id,owner,name)=>{if(!user)return showAuth("login");const key=[user.id,owner,id].sort().join("_");pop('<button style="float:right" onclick="closeModal()">×</button><h2>Chat with '+name+'</h2><div id="messages" class="messages"></div><form onsubmit="sendChat(event,\''+key+'\',\''+user.id+'\',\''+owner+'\')"><input required placeholder="Write a message"><div class="buttons"><button class="full">Send</button></div></form>');watchMessages(key,x=>{const b=document.getElementById("messages");if(b)b.innerHTML=x.map(m=>'<p>'+esc(m.body)+'</p>').join("")})};window.sendChat=async(e,id,a,b)=>{e.preventDefault();const i=e.target.querySelector("input");await sendMessage(id,[a,b],i.value);i.value=""};
watchAuth(async u=>{user=u;profile=null;if(stopPosts)stopPosts();stopPosts=watchPosts(x=>{posts=x;renderPosts()});home();if(!u)return;try{profile=await getUserProfile(u.id);home()}catch(e){console.warn(e)}});
</script></body></html>
