<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PetCircle — A kinder neighborhood starts here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2c29;--muted:#6e7c78;--green:#267b60;--deep:#174d3d;
  --mint:#e8f3ec;--cream:#fbfaf5;--paper:#fff;--coral:#e67250;
  --line:#e3e7e1;--soft:#f1f5f0;--shadow:0 15px 40px #1d4a3512;
  --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:14px 'DM Sans',sans-serif;line-height:1.5}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* ===== Top bar ===== */
.top{height:74px;background:#fffefdf5;border-bottom:1px solid var(--line);padding:0 max(22px,calc((100vw - 1240px)/2));display:flex;align-items:center;gap:32px;position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
.brand{font:700 25px 'Playfair Display';color:var(--deep);white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--deep));display:grid;place-items:center;font-size:17px}
.brand em{font:normal 21px sans-serif;color:var(--coral)}
.search{max-width:375px;flex:1;position:relative}
.search b{position:absolute;left:13px;top:11px;color:var(--muted);font-size:17px}
.search input{width:100%;padding:11px 14px 11px 37px;border:1px solid var(--line);border-radius:10px;background:#fafbf8;outline-color:var(--green)}
.nav{display:flex;align-items:center;gap:20px;margin-left:auto}
.nav button{background:none;font-weight:700;color:var(--muted);padding:7px;border-radius:8px}
.nav button:hover,.nav button.active{color:var(--green)}
.primary{background:var(--deep)!important;color:white!important;border-radius:9px;padding:10px 16px!important}
.nav button.ghost{color:var(--deep)}

/* ===== Hero ===== */
.page{max-width:1240px;margin:auto;padding:40px 22px 70px}
.hero{padding:34px 0 40px;text-align:center;max-width:820px;margin:auto}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--coral)}
.hero h1{font-family:'Playfair Display';font-size:clamp(38px,5.5vw,62px);letter-spacing:-2px;line-height:1.05;margin:14px 0 16px}
.hero p{color:var(--muted);font-size:17px;line-height:1.6;margin:0 auto;max-width:600px}

/* ===== Action cards ===== */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:34px auto 0;max-width:1000px}
.action{background:#fff;border:1px solid var(--line);border-radius:var(--radius);text-align:left;padding:20px;display:flex;align-items:center;gap:14px;transition:.2s;box-shadow:var(--shadow)}
.action:hover{transform:translateY(-4px);border-color:#b7d2c3}
.action .icon{font-style:normal;background:var(--mint);border-radius:13px;width:46px;height:46px;display:grid;place-items:center;font-size:21px;flex:none}
.action.help .icon{background:#fff0ea}
.action b,.action small{display:block}
.action small{color:var(--muted);font-size:12px;margin-top:3px}

/* ===== Workspace ===== */
.workspace{background:var(--soft);border-top:1px solid var(--line);padding:30px 0}
.grid{max-width:1240px;margin:auto;padding:0 22px;display:grid;grid-template-columns:245px minmax(0,670px) 240px;gap:27px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.filter{padding:18px}
.split{display:flex;align-items:center;justify-content:space-between}
.split b{font-size:16px}
.link{color:var(--green);font-size:12px;font-weight:700;background:none;padding:0}
.field{padding:15px 0 0}
.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:7px}
.field select,.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink);outline-color:var(--green)}
.checks{display:grid;gap:9px;margin-top:4px;font-size:13px}
.checks label{display:flex;gap:8px;align-items:center}
.checks input{accent-color:var(--green)}
.full{width:100%;margin-top:18px;padding:11px;background:var(--deep);color:#fff;border-radius:9px;font-weight:700}

/* ===== Feed ===== */
.feedbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 13px}
.feedbar h2{font-family:'Playfair Display';margin:0;font-size:25px}
.feedbar span{font-size:12px;color:var(--muted)}
.post{overflow:hidden;margin-bottom:16px}
.posthead{padding:15px 16px 0;display:flex;align-items:center;gap:10px}
.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:var(--mint);font-size:19px;flex:none}
.who b,.who small{display:block}
.who b{font-size:13px}
.who small{font-size:11px;color:var(--muted);margin-top:2px}
.tag{margin-left:auto;border-radius:20px;padding:6px 9px;font-size:10px;font-weight:700;background:var(--mint);color:var(--green)}
.tag.help{background:#fff0ea;color:#b35439}
.copy{padding:14px 16px;font-size:14px;line-height:1.52}
.copy strong{color:var(--deep)}
.postimg{width:100%;height:320px;object-fit:cover;display:block;background:#d8e2db}
.postfoot{padding:12px 16px;display:flex;gap:17px;align-items:center;color:var(--muted);font-size:12px}
.postfoot button{background:none;padding:0;color:inherit}
.postfoot button:hover{color:var(--coral)}
.postfoot button.liked{color:var(--coral)}
.place{margin-left:auto;color:var(--green);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:34px 20px}

/* ===== Right sidebar ===== */
.right{padding:18px}
.right h3{font-family:'Playfair Display';margin:0 0 8px;font-size:19px}
.helper{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px}
.helper .icon{font-style:normal;width:38px;height:38px;border-radius:11px;background:var(--mint);display:grid;place-items:center;flex:none}
.helper b,.helper small{display:block}
.helper b{font-size:12px}
.helper small{font-size:11px;color:var(--muted);margin-top:2px}
.more{display:block;margin-top:7px}

/* ===== Modal ===== */
.modal-back{position:fixed;inset:0;background:#122a2380;z-index:50;display:grid;place-items:center;padding:17px}
.modal{width:min(570px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:25px;box-shadow:0 25px 60px #0e201999}
.modal h2{font-family:'Playfair Display';margin:0;font-size:27px}
.modal>p{color:var(--muted);line-height:1.5;margin:7px 0 18px}
.close{float:right;background:var(--soft);border-radius:50%;width:30px;height:30px;color:var(--muted);font-size:16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .wide{grid-column:1/-1}
.photo-upload{border:1.5px dashed #a8c9b8;border-radius:11px;background:#f5faf6;padding:17px;text-align:center;color:var(--green);font-weight:700;cursor:pointer}
.preview{width:100%;height:145px;object-fit:cover;border-radius:10px;margin-top:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.cancel{padding:10px 15px;border-radius:9px;background:var(--soft);font-weight:700}
.submit{padding:10px 16px;border-radius:9px;background:var(--deep);color:white;font-weight:700}

/* ===== Auth ===== */
.auth{min-height:100vh;background:linear-gradient(130deg,#e8f3ec 0%,#fbfaf5 53%,#f4ded2 100%);display:grid;place-items:center;padding:22px}
.authbox{width:min(445px,100%);background:#fff;padding:34px;border:1px solid #e5e8e2;border-radius:20px;box-shadow:0 18px 45px #28483818}
.authbox .brand{display:flex;align-items:center;gap:8px;margin-bottom:26px}
.authbox h1{font-family:'Playfair Display';margin:0;font-size:34px}
.authbox p{color:var(--muted);line-height:1.5}
.authbox .field{padding-top:13px}
.authbox .full{width:100%;margin:22px 0 14px;padding:11px;background:var(--deep);color:#fff;border-radius:9px;font-weight:700}
.authswitch{text-align:center;color:var(--muted);font-size:13px}
.authswitch button{color:var(--green);background:none;font-weight:700}

/* ===== Chat ===== */
.chat{width:min(800px,100%);height:min(620px,90vh);padding:0;display:grid;grid-template-columns:230px 1fr}
.chats{border-right:1px solid var(--line);padding:18px}
.chats h2{font-family:'Playfair Display';margin:0 0 16px;font-size:23px}
.chatperson{width:100%;text-align:left;background:var(--mint);border-radius:11px;padding:10px;display:flex;gap:9px;align-items:center}
.chatperson b,.chatperson small{display:block}
.chatperson small{color:var(--muted);font-size:11px}
.chatmain{display:flex;flex-direction:column;min-width:0}
.chathead{padding:18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.messages{flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;overflow:auto;background:#fafbf8}
.bubble{max-width:77%;padding:10px 12px;border-radius:13px 13px 13px 3px;background:#e9eee9;line-height:1.4;font-size:13px}
.bubble.me{align-self:flex-end;background:var(--deep);color:#fff;border-radius:13px 13px 3px 13px}
.composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
.composer input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px;outline-color:var(--green)}
.composer button{background:var(--green);color:white;border-radius:9px;padding:0 14px;font-weight:700}

/* ===== Footer ===== */
.footer{background:var(--deep);color:#dceae4;padding:40px 20px 24px;margin-top:0}
.footer-inner{max-width:1240px;margin:auto;display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:30px}
.footer h4{color:#fff;margin:0 0 10px;font-size:14px}
.footer a,.footer p{color:#9fb5b0;font-size:13px;line-height:1.8;display:block}
.footer a:hover{color:#fff}
.copyright{max-width:1240px;margin:30px auto 0;padding-top:18px;border-top:1px solid #2b4a46;color:#8ba6a0;font-size:12px}

/* ===== Toast ===== */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:9px;align-items:center}
.toast{background:var(--deep);color:#fff;padding:11px 17px;border-radius:10px;font-size:13px;box-shadow:0 10px 24px #122a2380;max-width:90vw}
.toast.err{background:#b3402c}

/* ===== Responsive ===== */
@media(max-width:900px){
  .grid{grid-template-columns:220px minmax(0,1fr)}
  .right{display:none}
  .nav .nlink,.search{display:none}
  .actions{grid-template-columns:1fr}
  .postimg{height:280px}
}
@media(max-width:580px){
  .top{height:65px;padding:0 16px;gap:12px}
  .brand{font-size:21px}
  .nav{gap:6px}
  .nav .signup{display:none}
  .primary{padding:8px 11px!important;font-size:12px}
  .hero{padding:26px 0 22px}
  .page{padding:26px 16px 40px}
  .grid{display:block;padding:0 16px}
  .filter{margin-bottom:18px}
  .workspace{padding:20px 0}
  .postimg{height:245px}
  .place{display:none}
  .formgrid{grid-template-columns:1fr}
  .formgrid .wide{grid-column:auto}
  .chat{grid-template-columns:1fr;height:85vh}
  .chats{display:none}
  .footer-inner{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');
const state={
  user:JSON.parse(localStorage.getItem('pc-user')||'null'),
  posts:JSON.parse(localStorage.getItem('pc-posts')||'null')||[]
};

// Sample posts shown when the user has no local posts yet
const defaults=[
  {id:'milo',kind:'adoption',author:'Paws & Whiskers Rescue',avatar:'🐾',time:'2 hours ago',location:'Delhi',pet:'Milo',text:'a sweet, playful 4-month-old pup looking for a forever family. He\'s vaccinated, gentle with children, and full of love.',img:'https://images.unsplash.com/photo-1558788353-f76d92427f16?auto=format&fit=crop&w=1000&q=85',count:32,distance:'Near you'},
  {id:'injured',kind:'help',author:'Riya Sharma',avatar:'🌿',time:'4 hours ago',location:'Koramangala',pet:'An indie dog',text:'is resting near 8th Block Park with a small wound on his leg. I\'ve given him water — can anyone help with transport or contact an NGO?',img:'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1000&q=85',count:18,distance:'Near you'}
];

const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));

function header(){
  return `<header class="top">
    <a href="#" class="brand" onclick="home()"><span class="logo">🐾</span>P<em>et</em>Circle</a>
    <div class="search"><b>⌕</b><input id="search" oninput="searchPosts()" placeholder="Search pets, breeds, or places"></div>
    <nav class="nav">
      <button class="nlink active" onclick="home()">Home</button>
      <button class="nlink" onclick="document.getElementById('feed').scrollIntoView({behavior:'smooth'})">Explore</button>
      <button class="badge" onclick="messages()" title="Messages">✉</button>
      ${state.user
        ? `<button class="ghost" onclick="profile()">${escape(state.user.name.split(' ')[0])}</button><button class="primary" onclick="logout()">Log out</button>`
        : `<button class="signup" onclick="auth('signup')">Sign up</button><button class="primary" onclick="auth('login')">Log in</button>`}
    </nav>
  </header>`;
}

function home(){
  app.innerHTML=header()+`
  <main class="page">
    <section class="hero">
      <div class="eyebrow">A kinder neighborhood starts here</div>
      <h1>Every animal deserves a safe way home.</h1>
      <p>Find a pet to adopt, report an injured animal, or connect with nearby people who can help.</p>
    </section>
    <section class="actions">
      <button class="action" onclick="adoptionForm()"><i class="icon">⌂</i><span><b>Post for adoption</b><small>Find a loving home for a pet</small></span></button>
      <button class="action help" onclick="helpForm()"><i class="icon">✚</i><span><b>Report an injured animal</b><small>Alert nearby people and NGOs</small></span></button>
      <button class="action" onclick="offerHelp()"><i class="icon">♡</i><span><b>Offer help</b><small>Foster, transport, donate, volunteer</small></span></button>
    </section>
  </main>
  <section class="workspace">
    <div class="grid">
      <aside class="card filter" id="filter">
        <div class="split"><b>Filter pets</b><button class="link" onclick="clearFilters()">Clear all</button></div>
        <div class="field"><label>Location</label><select id="loc"><option>Near me (10 km)</option><option>Delhi</option><option>Mumbai</option><option>Bengaluru</option></select></div>
        <div class="field"><label>Looking for</label><select id="type" onchange="searchPosts()"><option value="all">Adoption & help</option><option value="adoption">Adoption</option><option value="help">Injured animals</option></select></div>
        <div class="field"><label>Type of pet</label><div class="checks"><label><input type="checkbox" checked> Dogs</label><label><input type="checkbox"> Cats</label><label><input type="checkbox"> Other animals</label></div></div>
        <button class="full" onclick="searchPosts()">Show matches</button>
      </aside>
      <section id="feed">
        <div class="feedbar"><h2>Nearby posts</h2><span id="count"></span></div>
        <div id="posts"></div>
      </section>
      <aside class="card right">
        <h3>Nearby helpers</h3>
        <div class="helper"><i class="icon">🏥</i><span><b>Happy Tails Clinic</b><small>Veterinary care · 1.8 km</small></span></div>
        <div class="helper"><i class="icon">🦮</i><span><b>Second Chance NGO</b><small>Rescue & fostering · 3.6 km</small></span></div>
        <div class="helper"><i class="icon">🚗</i><span><b>Arjun Verma</b><small>Can help with transport</small></span></div>
        <button class="link more" onclick="offerHelp()">See all nearby helpers →</button>
      </aside>
    </div>
  </section>
  <footer class="footer">
    <div class="footer-inner">
      <div><a class="brand" href="#" onclick="home()"><span class="logo">🐾</span>P<em>et</em>Circle</a><p>Compassion. Connection. A better tomorrow for every animal.</p></div>
      <div><h4>Explore</h4><a onclick="adoptionForm()">Adopt a pet</a><a onclick="helpForm()">Rescue cases</a><a>Partner NGOs</a></div>
      <div><h4>Support</h4><a>Safety centre</a><a>Contact us</a><a>Help & FAQs</a></div>
      <div><h4>Stay connected</h4><a>Instagram</a><a>Facebook</a><a>hello@petcircle.org</a></div>
    </div>
    <div class="copyright">© 2026 PetCircle. Made with care for every paw, whisker, and heart.</div>
  </footer>`;
  renderPosts();
}

/* ===== Posts ===== */
function allPosts(){return [...state.posts.map(p=>({...p,user:true})),...defaults]}

function renderPosts(list){
  const feed=document.getElementById('feed');
  if(!feed)return;
  const src=list||allPosts();
  const q=(document.getElementById('search')?.value||'').toLowerCase();
  const type=document.getElementById('type')?.value||'all';
  const p=src.filter(x=>(type==='all'||x.kind===type)&&(`${x.pet} ${x.location} ${x.author}`.toLowerCase().includes(q)));
  document.getElementById('count').textContent=`${p.length} post${p.length!==1?'s':''} around you`;
  document.getElementById('posts').innerHTML=p.map(x=>`
    <article class="card post">
      <div class="posthead">
        <div class="avatar">${x.avatar||'🐾'}</div>
        <div class="who"><b>${escape(x.author)}</b><small>${escape(x.time||'Just now')} · ${escape(x.location)}</small></div>
        <span class="tag ${x.kind==='help'?'help':''}">${x.kind==='help'?'NEEDS HELP':'FOR ADOPTION'}</span>
      </div>
      <div class="copy"><strong>${escape(x.pet)} —</strong> ${escape(x.text)}</div>
      ${x.img?`<img class="postimg" src="${x.img}" alt="Photo shared for ${escape(x.pet)}">`:''}
      <div class="postfoot">
        <button onclick="interest(this,'${x.id}')">♡ <span>${x.count||0}</span> ${x.kind==='help'?'I can help':'Interested'}</button>
        <button onclick="messages('${escape(x.author)}','${escape(x.pet)}')">✉ Message</button>
        <span class="place">⌖ ${escape(x.distance||'Near you')}</span>
      </div>
    </article>`).join('')||'<div class="card empty">No matches yet. Try another search or filter.</div>';
}

function searchPosts(){renderPosts()}
function clearFilters(){
  document.getElementById('search').value='';
  document.getElementById('type').value='all';
  renderPosts();
}
function interest(btn,id){
  const s=btn.querySelector('span');
  s.textContent=+s.textContent+1;
  btn.classList.add('liked');
  btn.disabled=true;
}

/* ===== Auth guard ===== */
function needAuth(next){if(state.user)return next();auth('login','Please log in first to continue.')}

/* ===== Forms ===== */
function adoptionForm(){needAuth(()=>postForm('adoption'))}
function helpForm(){needAuth(()=>postForm('help'))}
function offerHelp(){
  needAuth(()=>modal(`
    <button class="close" onclick="closeModal()">×</button>
    <h2>Offer your help</h2>
    <p>Thank you for showing up. Tell the community how you can help animals nearby.</p>
    <div class="field"><label>I can help with</label><select><option>Fostering a pet</option><option>Transport to a vet</option><option>Veterinary support</option><option>Donation or supplies</option></select></div>
    <div class="field"><label>Short note</label><textarea placeholder="For example: I have a car and can help in the evenings."></textarea></div>
    <div class="modal-actions"><button class="cancel" onclick="closeModal()">Cancel</button><button class="submit" onclick="closeModal();toast('Thank you! Your offer has been shared.')">Share offer</button></div>
  `));
}

let currentImage='';
function postForm(kind){
  const isHelp=kind==='help';
  modal(`
    <button class="close" onclick="closeModal()">×</button>
    <h2>${isHelp?'Report an injured animal':'Post a pet for adoption'}</h2>
    <p>${isHelp?'Share enough detail so someone can respond quickly.':'A clear photo and details help the right family find this pet.'}</p>
    <form id="postform" onsubmit="publish(event,'${kind}')">
      <div class="formgrid">
        <div class="field"><label>${isHelp?'Animal type':'Pet name'}</label><input required name="pet" placeholder="${isHelp?'e.g. Brown indie dog':'e.g. Milo'}"></div>
        <div class="field"><label>Location</label><input required name="location" placeholder="Area, city"></div>
        <div class="field wide"><label>Details</label><textarea required name="text" placeholder="${isHelp?'Describe the condition, exact spot, and help needed.':'Age, temperament, vaccination status, and what home they need.'}"></textarea></div>
        <div class="field wide"><label>Add a photo</label><label class="photo-upload">📷 Choose a photo<input type="file" accept="image/*" onchange="previewPhoto(event)" hidden><img id="preview" class="preview hidden" alt="Photo preview"></label></div>
      </div>
      <div class="modal-actions"><button type="button" class="cancel" onclick="closeModal()">Cancel</button><button class="submit">Publish post</button></div>
    </form>`);
}
function previewPhoto(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{currentImage=r.result;const p=document.getElementById('preview');p.src=currentImage;p.classList.remove('hidden')};
  r.readAsDataURL(f);
}
function publish(e,kind){
  e.preventDefault();
  const d=new FormData(e.target);
  const post={id:'p'+Date.now(),kind,author:state.user.name,avatar:'🙂',time:'Just now',location:d.get('location'),pet:d.get('pet'),text:d.get('text'),img:currentImage,count:0,distance:'Your area'};
  state.posts.unshift(post);
  localStorage.setItem('pc-posts',JSON.stringify(state.posts));
  currentImage='';
  closeModal();
  toast('Your post is live! 🐾');
  renderPosts();
  document.getElementById('feed').scrollIntoView({behavior:'smooth'});
}

/* ===== Modal helpers ===== */
function modal(content,cls='modal'){
  const x=document.createElement('div');
  x.id='overlay';x.className='modal-back';
  x.innerHTML=`<div class="${cls}">${content}</div>`;
  x.onclick=e=>{if(e.target===x)closeModal()};
  document.body.append(x);
}
function closeModal(){document.getElementById('overlay')?.remove()}

/* ===== Auth ===== */
function auth(mode,msg=''){
  app.innerHTML=`
    <main class="auth">
      <section class="authbox">
        <a class="brand" href="#" onclick="home()"><span class="logo">🐾</span>P<em>et</em>Circle</a>
        <h1>${mode==='login'?'Welcome back':'Create your account'}</h1>
        <p>${msg||(mode==='login'?'Log in to post, save pets, and talk to people in your community.':'Join your local animal community. It only takes a moment.')}</p>
        <form onsubmit="authSubmit(event,'${mode}')">
          ${mode==='signup'?`<div class="field"><label>Your name</label><input required name="name" placeholder="Your full name"></div>`:''}
          <div class="field"><label>Email address</label><input required type="email" name="email" placeholder="you@example.com"></div>
          <div class="field"><label>Password</label><input required type="password" minlength="4" placeholder="At least 4 characters"></div>
          <button class="full">${mode==='login'?'Log in':'Create account'}</button>
        </form>
        <div class="authswitch">${mode==='login'?`New here? <button onclick="auth('signup')">Create an account</button>`:`Already have an account? <button onclick="auth('login')">Log in</button>`}</div>
      </section>
    </main>`;
}
function authSubmit(e,mode){
  e.preventDefault();
  const d=new FormData(e.target);
  state.user={name:d.get('name')||d.get('email').split('@')[0],email:d.get('email')};
  localStorage.setItem('pc-user',JSON.stringify(state.user));
  toast(mode==='login'?'Welcome back!':'Account created!');
  home();
}
function logout(){localStorage.removeItem('pc-user');state.user=null;toast('Logged out.');home()}
function profile(){
  modal(`
    <button class="close" onclick="closeModal()">×</button>
    <h2>${escape(state.user.name)}</h2>
    <p>${escape(state.user.email)}<br>Community member on PetCircle</p>
    <button class="full" onclick="closeModal();adoptionForm()">Post an adoption</button>
  `);
}

/* ===== Messages ===== */
function messages(name='Paws & Whiskers Rescue',pet='Milo'){
  if(!state.user)return auth('login','Log in to chat with posters and adopters.');
  modal(`
    <div class="chats">
      <h2>Messages</h2>
      <button class="chatperson"><span class="avatar">🐾</span><span><b>${escape(name)}</b><small>About ${escape(pet)}</small></span></button>
    </div>
    <div class="chatmain">
      <div class="chathead">
        <span class="avatar">🐾</span>
        <span><b>${escape(name)}</b><small style="display:block;color:var(--muted);font-size:11px">Usually replies within an hour</small></span>
        <button class="close" style="margin-left:auto" onclick="closeModal()">×</button>
      </div>
      <div class="messages" id="msgs">
        <div class="bubble">Hi! Thanks for reaching out about ${escape(pet)}. How can I help?</div>
        <div class="bubble me">Hello, I\'m interested and would love to know more.</div>
      </div>
      <form class="composer" onsubmit="sendMessage(event)"><input required placeholder="Write a message..."><button>Send</button></form>
    </div>
  `,'modal chat');
}
function sendMessage(e){
  e.preventDefault();
  const v=e.target.querySelector('input').value.trim();
  if(!v)return;
  document.getElementById('msgs').insertAdjacentHTML('beforeend',`<div class="bubble me">${escape(v)}</div>`);
  e.target.reset();
  setTimeout(()=>document.getElementById('msgs')?.insertAdjacentHTML('beforeend','<div class="bubble">Thanks! I\'ll get back to you shortly. 🐾</div>'),500);
}

/* ===== Toast ===== */
function toast(msg,type='ok'){
  let box=document.getElementById('toasts');
  if(!box){box=document.createElement('div');box.id='toasts';box.className='toasts';document.body.append(box)}
  const c=document.createElement('div');
  c.className='toast '+(type==='err'?'err':'');
  c.textContent=msg;
  box.append(c);
  setTimeout(()=>{c.style.opacity='0';c.style.transition='.3s';setTimeout(()=>c.remove(),300)},2600);
}

home();
</script>
</body>
</html>
